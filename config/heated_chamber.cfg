# heated_chamber.cfg - staged start for heated-chamber prints (ASA / ABS)
#
# OrcaSlicer machine start G-code (replaces the old M140/M104/M190/M109 + START_PRINT lines):
#   START_PRINT_HOT EXTRUDER=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer_single] CHAMBER=[chamber_temperature]
#
# Sequence (nozzle stays OFF until the very end):
#   1. bed heats alone until within BED_MARGIN of target  (keeps bed + chamber heaters from drawing max current together)
#   2. chamber heater switched on, soak until chamber reaches target or SOAK_MAX minutes pass (then prints anyway, with a warning)
#   3. bed settles at target (M190)
#   4. stock START_PRINT: nozzle wipe, Z-offset, QGL, bed mesh - done hot, so calibration matches print conditions
#   5. nozzle heats to print temperature (M109)
#
# Params: EXTRUDER, BED, CHAMBER (capped at 60 C), SOAK_MAX (minutes, default 20),
#         BED_MARGIN (default 5 C), DRYRUN=1 (print the plan, do nothing).
#
# NOTE: do not put Jinja comments (curly-brace + hash) in macros - Klipper's config parser treats the hash as a comment and fails to load.

[gcode_macro START_PRINT_HOT]
description: Staged heated-chamber start. Params: EXTRUDER BED CHAMBER SOAK_MAX BED_MARGIN DRYRUN
gcode:
    {% set ext = params.EXTRUDER|default(0)|float %}
    {% set bed = params.BED|default(0)|float %}
    {% set chamber = [params.CHAMBER|default(0)|float, 60.0]|min %}
    {% set soak_max = params.SOAK_MAX|default(20)|float %}
    {% set margin = params.BED_MARGIN|default(5)|float %}
    {% set dry = params.DRYRUN|default(0)|int %}
    {% set steps = (soak_max * 3)|round(0, 'ceil')|int %}
    {% if dry == 1 %}
        RESPOND MSG="DRYRUN: bed {bed}C (chamber heater starts at {bed - margin}C), chamber {chamber}C, soak cap {soak_max} min, then START_PRINT, then nozzle {ext}C. Nothing was heated or moved."
    {% else %}
        CLEAR_PAUSE
        M141 S0
        {% if bed > 0 %}
            RESPOND MSG="Stage 1: heating bed to {bed}C"
            M140 S{bed}
            TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - margin}
        {% endif %}
        {% if chamber > 0 %}
            RESPOND MSG="Stage 2: heating chamber to {chamber}C (soak cap {soak_max} min)"
            M141 S{chamber}
            {% for i in range(steps) %}
                _CHAMBER_SOAK_STEP TARGET={chamber}
            {% endfor %}
            _CHAMBER_SOAK_REPORT TARGET={chamber}
        {% endif %}
        {% if bed > 0 %}
            M190 S{bed}
        {% endif %}
        RESPOND MSG="Stage 3: calibration (START_PRINT)"
        START_PRINT
        {% if ext > 0 %}
            RESPOND MSG="Stage 4: heating nozzle to {ext}C"
            M109 S{ext}
        {% endif %}
        RESPOND MSG="START_PRINT_HOT complete"
    {% endif %}

# One 20 s wait step. START_PRINT_HOT lists SOAK_MAX*3 of these in a row (Klipper forbids a macro calling itself).
# Each step checks the live chamber temperature when it runs; once the target is reached the remaining steps do nothing.
# M400 is required: G4 alone only queues the dwell, M400 makes the step really wait before the next one is evaluated.
[gcode_macro _CHAMBER_SOAK_STEP]
description: One 20 s soak step if the chamber is below target. Params: TARGET
gcode:
    {% set target = params.TARGET|float %}
    {% set cur = printer["heater_generic chamber_temp"].temperature %}
    {% if cur < target - 1.0 %}
        M117 Chamber {cur|round(0)|int}/{target|round(0)|int}C
        G4 P20000
        M400
    {% endif %}

[gcode_macro _CHAMBER_SOAK_REPORT]
description: Report soak result. Params: TARGET
gcode:
    {% set target = params.TARGET|float %}
    {% set cur = printer["heater_generic chamber_temp"].temperature %}
    {% if cur >= target - 1.0 %}
        RESPOND MSG="Chamber at {cur|round(1)}C (target {target}C) - soak complete"
    {% else %}
        RESPOND TYPE=error MSG="Soak time limit reached: chamber {cur|round(1)}C, target {target}C. Printing anyway."
    {% endif %}
